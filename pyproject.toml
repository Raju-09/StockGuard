[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stockguard"
version = "0.1.0"
description = "Predict true product demand despite inventory-censored sales data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core data stack
    "pandas>=2.2,<3",
    "numpy>=1.26,<2",
    "matplotlib>=3.8,<4",
    # Stats / ML — added as we reach each phase
    "scikit-learn>=1.4,<2",
    "statsmodels>=0.14,<1",   # Tobit / censored regression (Phase 8)
    "xgboost>=2.0,<3",        # Gradient boosting (Phase 5+)
    # Serving — Phase 11
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.29,<1",
    "jinja2>=3.1,<4",
    # Persistence
    "joblib>=1.3,<2",
    # Notebook kernel
    "ipykernel>=6.29,<7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

# ── Package discovery ─────────────────────────────────────────────────────────
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ── Ruff (linter + formatter) ─────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W: pycodestyle  F: pyflakes  I: isort  N: pep8-naming  UP: pyupgrade
select = ["E", "W", "F", "I", "N", "UP"]
ignore = [
    "E501",   # line too long — handled at formatter level
    "N806",   # uppercase variable name like X in ML
    "N803",   # uppercase argument name like X in ML
    "N802",   # function name like test_get_X_y
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
